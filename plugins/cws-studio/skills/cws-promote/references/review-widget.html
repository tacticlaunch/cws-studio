<!--
  Review-routing star widget for the extension UI (Stage 4).
  Behavior: clicking 4 or 5 stars -> CWS reviews page (public review);
  clicking 1, 2 or 3 stars -> a Google Form (private feedback, no public review).
  Replace the two URLs before shipping:
    - CWS reviews URL  -> your extension's /reviews page
    - Google Form URL  -> your private-feedback form
-->
<style>
  .full-stars { text-align: center; }
  .full-stars .rating-group { display: inline-flex; }
  .full-stars input { position: absolute; left: -9999px; }
  .full-stars label { margin: 0; cursor: pointer; }
  .full-stars label a svg {
    margin: 2px; height: 30px; width: 30px;
    fill: #ff8400; transition: fill 0.3s;
  }
  .full-stars input:checked ~ label a svg { fill: #ffc711; }
  .full-stars .rating-group:hover label a svg { fill: #ff8400; }
  .full-stars .rating-group input:hover ~ label a svg { fill: #ffc711; }
</style>

<hr style="border: 0; border-top: 3px solid #bbb; opacity: 0.25" />
<p style="text-align: center; font-family: arial, sans-serif; font-size: 16px">
  Rate us:
</p>

<div class="full-stars">
  <div class="rating-group">
    <input name="fst" value="5" type="radio" disabled checked />
    <!-- 1 star -> Google Form -->
    <label for="fst-1">
      <a href="GOOGLE_FORM_URL">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"><path d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z"/></svg>
      </a>
    </label>
    <input name="fst" id="fst-1" value="1" type="radio" />
    <!-- 2 stars -> Google Form -->
    <label for="fst-2">
      <a href="GOOGLE_FORM_URL">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"><path d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z"/></svg>
      </a>
    </label>
    <input name="fst" id="fst-2" value="2" type="radio" />
    <!-- 3 stars -> Google Form -->
    <label for="fst-3">
      <a href="GOOGLE_FORM_URL">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"><path d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z"/></svg>
      </a>
    </label>
    <input name="fst" id="fst-3" value="3" type="radio" />
    <!-- 4 stars -> CWS reviews -->
    <label for="fst-4">
      <a href="CWS_REVIEWS_URL">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"><path d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z"/></svg>
      </a>
    </label>
    <input name="fst" id="fst-4" value="4" type="radio" />
    <!-- 5 stars -> CWS reviews -->
    <label for="fst-5">
      <a href="CWS_REVIEWS_URL">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"><path d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z"/></svg>
      </a>
    </label>
    <input name="fst" id="fst-5" value="5" type="radio" />
  </div>
</div>
